name: MinecraftRPG
version: '${version}'
main: io.github.qpfr123.rpg.RpgPlugin
api-version: '1.21.11'
description: Minecraft RPG
commands:
  rpg:
    description: 스탯 확인·배분, 보상 수령
    usage: /rpg stats | alloc <스탯> <양> | claim
    permission: minecraftrpg.player
  rpgadmin:
    description: RPG 관리자 조회·테스트
    usage: /rpgadmin profile|ledger <플레이어>, spawn <몹> [플레이어], backup, level, givegear, testgrant, dbfail, crashtest, dungeon
    permission: minecraftrpg.admin
  dungeon:
    description: 던전 입장·퇴장
    usage: /dungeon enter <던전ID> | leave | list
    permission: minecraftrpg.player
  party:
    description: 파티
    usage: /party invite <플레이어> | accept | leave | list
    permission: minecraftrpg.player
permissions:
  minecraftrpg.player:
    default: true
  minecraftrpg.admin:
    default: op
